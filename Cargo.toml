[workspace]
members = [".", "crates/cli"]

[package]
name = "wilysearch"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"

[features]
default = []
ai = ["dep:async-openai", "dep:tokio", "dep:futures", "dep:tokio-stream"]
surrealdb = ["dep:surrealdb", "dep:tokio"]

[dependencies]
# Meilisearch 1.54 development snapshot (2026-09-19).
meilisearch-types = { git = "https://github.com/meilisearch/meilisearch", rev = "1380adaacebad8a019d88549a06bae2dd90de249" }
milli = { git = "https://github.com/meilisearch/meilisearch", rev = "1380adaacebad8a019d88549a06bae2dd90de249" }
permissive-json-pointer = { git = "https://github.com/meilisearch/meilisearch", rev = "1380adaacebad8a019d88549a06bae2dd90de249" }
file-store = { git = "https://github.com/meilisearch/meilisearch", rev = "1380adaacebad8a019d88549a06bae2dd90de249" }
http-client = { git = "https://github.com/meilisearch/meilisearch", rev = "1380adaacebad8a019d88549a06bae2dd90de249" }

# Optional chat provider client: same upstream fork and network policy as milli.
async-openai = { git = "https://github.com/meilisearch/meilisearch", rev = "1380adaacebad8a019d88549a06bae2dd90de249", optional = true }
futures = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# milli's Rhai document updater requires this transitive serialization feature.
smartstring = { version = "1", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }

# Error handling / logging
# thiserror: structured error enums in core/error.rs (public API)
# anyhow: ad-hoc errors in internal plumbing (config loading, test helpers)
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
tracing = "0.1"

# Data structures / concurrency
uuid = { version = "1.11", features = ["v4"] }
time = { version = "0.3", features = ["serde-well-known"] }
roaring = "0.11"
crossbeam-channel = "0.5"
rayon = "1.10"
bumpalo = "3.16"
bumparaw-collections = "0.2"
fst = "0.4"

# Query preprocessing
symspell = "0.4"
strsim = "0.11"
unicode-normalization = "0.1"

# Optional SurrealDB support
surrealdb = { version = "2.6", features = ["kv-mem", "kv-rocksdb"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"], optional = true }
paste = "1.0.15"

[dev-dependencies]
# Used by RAG implementation tests (block_on for async trait methods)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3.15"
figment = { version = "0.10", features = ["toml", "env", "test"] }

[lints.rust]
# unsafe blocks have SAFETY comments; warn to keep them visible in diffs.
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
# These fire on RoaringBitmap::len() as usize and similar; documented inline.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
